<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="barGradA1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="barGradA2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="34" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
    Reproduction Error as Fraction of Preregistered Acceptance Limit (R₁)
  </text>
  <text x="30" y="52" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">
    Tolerance budget consumption | run-003-recreation vs Nature published reference
  </text>

  <!-- Metric 1: Target A1 (eps_7) -->
  <g transform="translate(30, 75)">
    <text x="0" y="16" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600">
      Target A1 · Libra ε₇
    </text>
    <text x="140" y="16" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">
      |Δ| = 1.35 × 10⁻⁶ / 5.00 × 10⁻⁶
    </text>

    <!-- Track -->
    <rect x="360" y="4" width="340" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Fill 27% of 340 = 91.8px -->
    <rect x="360" y="4" width="91.8" height="18" rx="4" fill="url(#barGradA1)"/>
    <text x="460" y="17" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">
      27%
    </text>
    <text x="500" y="17" fill="#7ee787" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">
      (73% margin unused)
    </text>
  </g>

  <!-- Metric 2: Target A2 (Lambda) -->
  <g transform="translate(30, 130)">
    <text x="0" y="16" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600">
      Target A2 · Libra Λ
    </text>
    <text x="140" y="16" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">
      |Δ| = 0.0017 / 0.0050
    </text>

    <!-- Track -->
    <rect x="360" y="4" width="340" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Fill 34% of 340 = 115.6px -->
    <rect x="360" y="4" width="115.6" height="18" rx="4" fill="url(#barGradA2)"/>
    <text x="485" y="17" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">
      34%
    </text>
    <text x="525" y="17" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11">
      (66% margin unused)
    </text>
  </g>

  <!-- Axis & Legend -->
  <g transform="translate(390, 185)">
    <!-- Baseline 0% -->
    <line x1="0" y1="0" x2="340" y2="0" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8b949e" stroke-width="1"/>
    <text x="0" y="18" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">
      0% (Exact match)
    </text>

    <!-- 50% marker -->
    <line x1="170" y1="0" x2="170" y2="4" stroke="#484f58" stroke-width="1"/>
    <text x="170" y="18" fill="#6e7681" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">
      50%
    </text>

    <!-- 100% Limit marker -->
    <line x1="310" y1="-120" x2="310" y2="6" stroke="#da3633" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="310" y="18" fill="#f85149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle">
      100% (Fail Limit R₁)
    </text>
  </g>
</svg>
